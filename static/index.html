<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DocChat — Chat with any PDF</title>
<meta name="description" content="Upload any PDF and instantly ask questions with AI. Precise answers with source citations."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{p:{50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7c3aed',800:'#6d28d9',900:'#4c1d95'}},keyframes:{fadeUp:{'0%':{opacity:'0',transform:'translateY(18px)'},'100%':{opacity:'1',transform:'translateY(0)'}},fadeIn:{'0%':{opacity:'0'},'100%':{opacity:'1'}},slideDown:{'0%':{opacity:'0',transform:'translateY(-10px)'},'100%':{opacity:'1',transform:'translateY(0)'}},dot:{'0%,80%,100%':{transform:'scale(0)',opacity:'0'},'40%':{transform:'scale(1)',opacity:'1'}}},animation:{'fade-up':'fadeUp 0.5s ease forwards','fade-in':'fadeIn 0.4s ease forwards','slide-down':'slideDown 0.5s ease forwards','dot':'dot 1.3s ease-in-out infinite'}}}}
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(160deg,#fefeff 0%,#f8f5ff 50%,#ede9fe 100%)}
.gtext{background:linear-gradient(135deg,#7c3aed,#a855f7,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.drop-active{border-color:#7c3aed!important;background:#f5f0ff!important;transform:scale(1.01)}
.chat-scroll::-webkit-scrollbar{width:5px}
.chat-scroll::-webkit-scrollbar-thumb{background:#d8b4fe;border-radius:3px}
.d1{animation-delay:0s}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
textarea{resize:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

/* ── Typing dots ─────────────────────────────── */
function Dots(){
  return(
    <div className="flex items-center gap-1.5 px-1 py-1">
      {[0,1,2].map(i=>(
        <span key={i} className={`w-2 h-2 rounded-full bg-p-400 inline-block animate-dot d${i+1}`} style={{animationDelay:`${i*.2}s`}}/>
      ))}
    </div>
  );
}

/* ── Chat bubble ─────────────────────────────── */
function Bubble({role,content,sources}){
  const u=role==='user';
  return(
    <div className={`flex w-full mb-3 animate-fade-up ${u?'justify-end':'justify-start'}`}>
      {!u&&(
        <div className="w-8 h-8 rounded-full bg-gradient-to-br from-p-700 to-p-400 flex items-center justify-center mr-2.5 mt-0.5 flex-shrink-0 shadow-md">
          <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
      )}
      <div className="max-w-[80%]">
        <div className={`rounded-2xl px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap shadow-sm ${u?'bg-p-700 text-white rounded-tr-sm':'bg-white text-gray-800 border border-gray-100 rounded-tl-sm'}`}>
          {content}
        </div>
        {!u&&sources&&sources.length>0&&(
          <div className="mt-1.5 space-y-1">
            <p className="text-xs text-gray-400 font-medium px-1">Sources</p>
            {sources.map((s,i)=>(
              <div key={i} className="bg-p-50 border border-p-100 rounded-lg px-3 py-1.5 text-xs text-p-700">
                <span className="font-semibold text-p-500">[{i+1}]</span> {s.content}
                {s.metadata?.page!=null&&<span className="text-p-400 ml-1">· p.{s.metadata.page+1}</span>}
              </div>
            ))}
          </div>
        )}
      </div>
      {u&&(
        <div className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center ml-2.5 mt-0.5 flex-shrink-0">
          <svg className="w-4 h-4 text-gray-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </div>
      )}
    </div>
  );
}

/* ── Chat panel ──────────────────────────────── */
function ChatPanel({fileName}){
  const [msgs,setMsgs]=useState([]);
  const [q,setQ]=useState('');
  const [busy,setBusy]=useState(false);
  const bottom=useRef(null);
  const inp=useRef(null);

  useEffect(()=>{
    setMsgs([{role:'assistant',content:`I've finished indexing "${fileName}". Ask me anything about it!`,sources:[]}]);
    inp.current?.focus();
  },[fileName]);

  useEffect(()=>{ bottom.current?.scrollIntoView({behavior:'smooth'}); },[msgs,busy]);

  const send=async()=>{
    const text=q.trim();
    if(!text||busy)return;
    setQ('');
    setMsgs(p=>[...p,{role:'user',content:text}]);
    setBusy(true);
    try{
      const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
      const d=await r.json();
      setMsgs(p=>[...p,{role:'assistant',content:r.ok?d.answer:'⚠️ '+(d.detail||'Error'),sources:d.sources||[]}]);
    }catch(e){
      setMsgs(p=>[...p,{role:'assistant',content:'Network error: '+e.message,sources:[]}]);
    }
    setBusy(false);
  };

  return(
    <div className="w-full max-w-2xl mx-auto mt-6 animate-slide-down">
      <div className="bg-white rounded-2xl shadow-xl shadow-p-100/40 border border-p-100/60 overflow-hidden">
        {/* Panel header */}
        <div className="px-5 py-3.5 border-b border-gray-100 flex items-center gap-3 bg-gradient-to-r from-p-50 to-white">
          <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm animate-pulse"/>
          <span className="text-sm font-semibold text-gray-700 truncate flex-1">{fileName}</span>
          <span className="text-xs text-p-500 font-semibold bg-p-50 border border-p-100 px-2.5 py-0.5 rounded-full">RAG · Active</span>
        </div>
        {/* Messages */}
        <div className="h-96 overflow-y-auto chat-scroll px-5 py-5 bg-gray-50/30">
          {msgs.map((m,i)=><Bubble key={i} role={m.role} content={m.content} sources={m.sources}/>)}
          {busy&&(
            <div className="flex items-start mb-3">
              <div className="w-8 h-8 rounded-full bg-gradient-to-br from-p-700 to-p-400 flex items-center justify-center mr-2.5 flex-shrink-0 shadow-md">
                <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
              </div>
              <div className="bg-white border border-gray-100 rounded-2xl rounded-tl-sm shadow-sm px-3 py-2"><Dots/></div>
            </div>
          )}
          <div ref={bottom}/>
        </div>
        {/* Input */}
        <div className="px-4 py-3 border-t border-gray-100 bg-white">
          <div className="flex items-end gap-2 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 focus-within:border-p-500 focus-within:ring-2 focus-within:ring-p-100 transition-all">
            <textarea
              ref={inp} id="question" rows={1} value={q}
              onChange={e=>setQ(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder="Ask anything about this document…"
              className="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400 leading-relaxed max-h-28 py-0.5"
            />
            <button id="ask-btn" onClick={send} disabled={!q.trim()||busy}
              className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition-all ${!q.trim()||busy?'bg-gray-200 text-gray-400 cursor-not-allowed':'bg-p-700 text-white hover:bg-p-800 hover:shadow-lg active:scale-95'}`}>
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
          </div>
          <p className="text-xs text-gray-400 mt-1.5 text-center">Enter to send · Shift+Enter for new line</p>
        </div>
      </div>
    </div>
  );
}

/* ── Upload zone ─────────────────────────────── */
function UploadZone({onSuccess}){
  const [drag,setDrag]=useState(false);
  const [file,setFile]=useState(null);
  const [busy,setBusy]=useState(false);
  const [st,setSt]=useState(null);
  const inp=useRef(null);

  const pick=f=>{ if(f){setFile(f);setSt(null);} };
  const onDrop=useCallback(e=>{e.preventDefault();setDrag(false);pick(e.dataTransfer.files[0]);},[]);
  const onOver=useCallback(e=>{e.preventDefault();setDrag(true);},[]);
  const onLeave=useCallback(()=>setDrag(false),[]);

  const upload=async()=>{
    if(!file)return;
    const ext=file.name.split('.').pop().toLowerCase();
    if(!['pdf','txt'].includes(ext)){setSt({err:'Only .pdf / .txt files are supported.'});return;}
    setBusy(true);setSt(null);
    const fd=new FormData();fd.append('file',file);
    try{
      const r=await fetch('/upload',{method:'POST',body:fd});
      const d=await r.json();
      if(r.ok){setSt({ok:d.message});onSuccess(file.name);}
      else{setSt({err:d.detail||'Upload failed.'});}
    }catch(e){setSt({err:'Network error: '+e.message});}
    setBusy(false);
  };

  return(
    <div className="w-full max-w-2xl mx-auto">
      {/* Drop zone */}
      <div
        onDrop={onDrop} onDragOver={onOver} onDragLeave={onLeave}
        onClick={()=>!file&&inp.current?.click()}
        className={`border-2 border-dashed rounded-2xl transition-all duration-300 cursor-pointer p-10 text-center
          ${drag?'drop-active':file?'border-p-300 bg-p-50/60 cursor-default':'border-p-200 bg-white hover:border-p-400 hover:bg-p-50/30'}
          shadow-lg shadow-p-100/30`}
      >
        <input ref={inp} type="file" accept=".pdf,.txt" className="hidden" id="file-input" onChange={e=>pick(e.target.files[0])}/>

        {!file?(
          <>
            <div className="mx-auto mb-4 w-16 h-16 rounded-2xl bg-gradient-to-br from-p-100 to-p-200 flex items-center justify-center">
              <svg className="w-8 h-8 text-p-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            </div>
            <p className="text-gray-700 font-semibold text-lg mb-1">Click to upload or drag PDF here</p>
            <p className="text-gray-400 text-sm">Supports .pdf and .txt files</p>
          </>
        ):(
          <>
            <div className="mx-auto mb-4 w-16 h-16 rounded-2xl bg-gradient-to-br from-p-500 to-p-700 flex items-center justify-center shadow-md">
              <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <p className="text-p-800 font-semibold text-base truncate px-4">{file.name}</p>
            <p className="text-p-400 text-sm mt-0.5">{(file.size/1024).toFixed(1)} KB</p>
            <button onClick={e=>{e.stopPropagation();setFile(null);setSt(null);}} className="mt-3 text-xs text-gray-400 hover:text-red-400 transition-colors underline">Remove</button>
          </>
        )}
      </div>

      {/* Upload button */}
      <button id="upload-btn" onClick={upload} disabled={!file||busy}
        className={`mt-4 w-full py-3.5 rounded-xl font-semibold text-sm tracking-wide transition-all duration-200 shadow-sm
          ${!file||busy?'bg-gray-100 text-gray-400 cursor-not-allowed shadow-none':'bg-gradient-to-r from-p-600 to-p-700 text-white hover:from-p-700 hover:to-p-800 hover:shadow-lg hover:shadow-p-200 active:scale-[.99]'}`}>
        {busy?(
          <span className="flex items-center justify-center gap-2">
            <svg className="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
            Processing document…
          </span>
        ):'Upload & Index PDF'}
      </button>

      {/* Status */}
      {st&&(
        <div className={`mt-3 px-4 py-2.5 rounded-xl text-sm font-medium animate-fade-in ${st.ok?'bg-emerald-50 text-emerald-700 border border-emerald-200':'bg-red-50 text-red-700 border border-red-200'}`}>
          {st.ok?'✓ '+st.ok:st.err}
        </div>
      )}
    </div>
  );
}

/* ── Professional arrow annotation ──────────── */
function Arrow(){
  return(
    <div className="flex flex-col items-start ml-[8%] sm:ml-[12%] mb-0 select-none pointer-events-none">
      {/* Clean professional curved arrow SVG */}
      <svg width="110" height="72" viewBox="0 0 110 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        {/* Curved path from top-left sweeping down-right */}
        <path
          d="M 18 10 C 30 6, 60 8, 82 30 C 92 42, 96 56, 98 62"
          stroke="#7c3aed"
          strokeWidth="2.2"
          strokeLinecap="round"
          fill="none"
        />
        {/* Clean arrowhead */}
        <path
          d="M 98 62 L 85 54"
          stroke="#7c3aed" strokeWidth="2.2" strokeLinecap="round"
        />
        <path
          d="M 98 62 L 90 74"
          stroke="#7c3aed" strokeWidth="2.2" strokeLinecap="round"
        />
      </svg>
      <p className="text-p-500 text-xs font-semibold tracking-wider uppercase ml-5 -mt-1">start here</p>
    </div>
  );
}

/* ── Main App ────────────────────────────────── */
function App(){
  const [uploaded,setUploaded]=useState(null);

  const handleSuccess=name=>{
    setUploaded(name);
    setTimeout(()=>document.getElementById('chat-section')?.scrollIntoView({behavior:'smooth',block:'start'}),350);
  };

  return(
    <div className="min-h-screen flex flex-col">

      {/* Nav */}
      <nav className="w-full px-6 py-4 flex items-center justify-between max-w-5xl mx-auto">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-lg bg-p-700 flex items-center justify-center shadow">
            <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </div>
          <span className="font-bold text-gray-900 text-base tracking-tight">DocChat</span>
        </div>
        <span className="text-xs text-p-600 font-semibold bg-p-50 border border-p-200 px-3 py-1 rounded-full">Powered by RAG · Groq</span>
      </nav>

      {/* Hero */}
      <section className="text-center px-6 pt-10 pb-6 animate-fade-up">
        <div className="inline-flex items-center gap-2 bg-p-50 border border-p-200 text-p-600 text-xs font-semibold px-3 py-1.5 rounded-full mb-6 shadow-sm">
          <span className="w-1.5 h-1.5 rounded-full bg-p-500 animate-pulse"/>
          AI-powered document intelligence
        </div>
        <h1 className="text-5xl sm:text-6xl font-extrabold tracking-tight text-gray-900 leading-tight mb-5">
          Chat with any <span className="gtext">PDF</span>
        </h1>
        <p className="text-gray-500 text-lg max-w-xl mx-auto leading-relaxed">
          Upload a document and instantly ask questions — get precise<br className="hidden sm:block"/>
          answers with source citations, powered by AI.
        </p>
      </section>

      {/* Arrow + Upload */}
      <section className="px-6 pb-6 flex flex-col items-center animate-fade-up" style={{animationDelay:'0.1s'}}>
        <Arrow/>
        <UploadZone onSuccess={handleSuccess}/>
      </section>

      {/* Chat section — revealed after upload */}
      {uploaded&&(
        <section id="chat-section" className="px-6 pb-16">
          <div className="w-full max-w-2xl mx-auto">
            <div className="flex items-center gap-3 mb-1">
              <div className="flex-1 h-px bg-gradient-to-r from-transparent via-p-200 to-transparent"/>
              <span className="text-xs text-p-400 font-semibold uppercase tracking-widest">Your AI Assistant</span>
              <div className="flex-1 h-px bg-gradient-to-r from-transparent via-p-200 to-transparent"/>
            </div>
          </div>
          <ChatPanel fileName={uploaded}/>
        </section>
      )}

      {/* Footer */}
      <footer className="mt-auto pb-8 text-center text-xs text-gray-400">
        Built with FastAPI · LangChain · FAISS · Groq LLaMA 3
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
